apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: freelancer-platform
  labels:
    app: lancehub
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lancehub
      tier: frontend
  template:
    metadata:
      labels:
        app: lancehub
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: lancehub-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
