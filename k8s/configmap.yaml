apiVersion: v1
kind: ConfigMap
metadata:
  name: lancehub-config
  namespace: freelancer-platform
  labels:
    app: lancehub
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_DIALECT: "postgres"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "freelancer_db"
  DB_USER: "postgres"
  FORCE_SEED: "true"
