
services:
  mongodb:
    image: docker.io/library/mongo:8
    container_name: lancehub-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lancehub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lancehub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/freelancer_platform
      PORT: 5000
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lancehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lancehub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lancehub-network

volumes:
  mongodb_data:

networks:
  lancehub-network:
    driver: bridge
